name: OpenMeter Railway bootstrap

# Thin caller. Bootstrap script stays in this repo; the workflow runs from
# pymthouse/pymthouse-deployments so it can target a chosen ref.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to bootstrap
        required: false
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    uses: pymthouse/pymthouse-deployments/.github/workflows/openmeter-railway-bootstrap.yml@main
    with:
      ref: ${{ inputs.ref || github.sha }}
    secrets: inherit
