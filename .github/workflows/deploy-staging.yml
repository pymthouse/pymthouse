name: Deploy staging

# Thin caller. Deploy logic lives in pymthouse/pymthouse-deployments.
# Auto-deploys on push to any branch except main, or manually deploys a chosen branch.
# Railway preview runs only when the ref is staging.

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to staging
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: pymthouse/pymthouse-deployments/.github/workflows/deploy-staging.yml@main
    with:
      ref: ${{ inputs.branch || github.ref_name }}
    secrets: inherit
