name: Deploy Railway production clearinghouse stack

# Thin caller. Railway uploads the tree in pymthouse/pymthouse-deployments.
# OpenMeter meter bootstrap still runs from this repo's checkout.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or SHA to bootstrap OpenMeter against
        required: false
        type: string

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: pymthouse/pymthouse-deployments/.github/workflows/deploy-railway-production.yml@main
    with:
      ref: ${{ inputs.ref || github.ref_name }}
    secrets: inherit
