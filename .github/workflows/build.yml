name: SonarQube Community analysis

on:
  push:
    branches: [main, 'releases/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pymthouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pymthouse_test"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/pymthouse_test
      AUTH_TOKEN_PEPPER: ci-test-auth-token-pepper-value-please-change
      NEXTAUTH_SECRET: ci-test-nextauth-secret-please-change

    steps:
      - name: Checkout pymthouse
        uses: actions/checkout@v7
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply database migrations
        run: npm run db:prepare

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Restore SonarQube scanner cache
        id: sonar-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonarqube-${{ runner.os }}-${{ runner.arch }}-26.5-${{ hashFiles('sonar-project.properties') }}
      - name: Set up scanner Java runtime
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: SonarQube Quality Gate scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_COMMUNITY_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.scanner.javaExePath=${{ env.JAVA_HOME }}/bin/java
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Save SonarQube scanner cache
        if: always() && steps.sonar-cache.outcome == 'success' && steps.sonar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ steps.sonar-cache.outputs.cache-primary-key }}
