name: Copy deploy secrets

# One-time copy of existing pymthouse Actions secrets onto pymthouse-deployments.
# Values are piped to `gh secret set` and are not printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Copy repository secrets
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENTS_ADMIN_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          OPENMETER_POSTGRES_PASSWORD: ${{ secrets.OPENMETER_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          copy() {
            local name="$1"
            local value="${!name-}"
            if [ -z "$value" ]; then
              echo "missing repo $name"
              return 0
            fi
            printf '%s' "$value" | gh secret set "$name" --repo pymthouse/pymthouse-deployments
            echo "set repo $name"
          }
          copy VERCEL_TOKEN
          copy RAILWAY_API_TOKEN
          copy RELEASE_PAT
          copy SNYK_TOKEN
          copy OPENMETER_POSTGRES_PASSWORD

  railway-preview:
    runs-on: ubuntu-latest
    environment: railway / preview
    steps:
      - name: Copy railway preview secrets
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENTS_ADMIN_TOKEN }}
          TARGET_ENV: railway / preview
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          OPENMETER_API_KEY: ${{ secrets.OPENMETER_API_KEY }}
          OPENMETER_URL: ${{ secrets.OPENMETER_URL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SIGNER_REMOTE_DISCOVERY: ${{ secrets.SIGNER_REMOTE_DISCOVERY }}
          TURNKEY_API_PRIVATE_KEY: ${{ secrets.TURNKEY_API_PRIVATE_KEY }}
          TURNKEY_API_PUBLIC_KEY: ${{ secrets.TURNKEY_API_PUBLIC_KEY }}
          TURNKEY_ORG_ID: ${{ secrets.TURNKEY_ORG_ID }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          copy() {
            local name="$1"
            local value="${!name-}"
            if [ -z "$value" ]; then
              echo "missing $TARGET_ENV $name"
              return 0
            fi
            printf '%s' "$value" | gh secret set "$name" --repo pymthouse/pymthouse-deployments --env "$TARGET_ENV"
            echo "set $TARGET_ENV $name"
          }
          copy ETH_RPC_URL
          copy OPENMETER_API_KEY
          copy OPENMETER_URL
          copy RAILWAY_API_TOKEN
          copy SIGNER_REMOTE_DISCOVERY
          copy TURNKEY_API_PRIVATE_KEY
          copy TURNKEY_API_PUBLIC_KEY
          copy TURNKEY_ORG_ID
          copy WEBHOOK_SECRET

  railway-production:
    runs-on: ubuntu-latest
    environment: railway / production
    steps:
      - name: Copy railway production secrets
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENTS_ADMIN_TOKEN }}
          TARGET_ENV: railway / production
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          OPENMETER_API_KEY: ${{ secrets.OPENMETER_API_KEY }}
          OPENMETER_URL: ${{ secrets.OPENMETER_URL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SIGNER_REMOTE_DISCOVERY: ${{ secrets.SIGNER_REMOTE_DISCOVERY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          copy() {
            local name="$1"
            local value="${!name-}"
            if [ -z "$value" ]; then
              echo "missing $TARGET_ENV $name"
              return 0
            fi
            printf '%s' "$value" | gh secret set "$name" --repo pymthouse/pymthouse-deployments --env "$TARGET_ENV"
            echo "set $TARGET_ENV $name"
          }
          copy ETH_RPC_URL
          copy OPENMETER_API_KEY
          copy OPENMETER_URL
          copy RAILWAY_API_TOKEN
          copy SIGNER_REMOTE_DISCOVERY
          copy WEBHOOK_SECRET

  vercel-preview:
    runs-on: ubuntu-latest
    environment: vercel / preview
    steps:
      - name: Copy vercel preview secrets
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENTS_ADMIN_TOKEN }}
          TARGET_ENV: vercel / preview
          AUTH_TOKEN_PEPPER: ${{ secrets.AUTH_TOKEN_PEPPER }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          copy() {
            local name="$1"
            local value="${!name-}"
            if [ -z "$value" ]; then
              echo "missing $TARGET_ENV $name"
              return 0
            fi
            printf '%s' "$value" | gh secret set "$name" --repo pymthouse/pymthouse-deployments --env "$TARGET_ENV"
            echo "set $TARGET_ENV $name"
          }
          copy AUTH_TOKEN_PEPPER
          copy NEXTAUTH_SECRET
          copy VERCEL_TOKEN

  vercel-production:
    runs-on: ubuntu-latest
    environment: vercel / production
    steps:
      - name: Copy vercel production secrets
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENTS_ADMIN_TOKEN }}
          TARGET_ENV: vercel / production
          AUTH_TOKEN_PEPPER: ${{ secrets.AUTH_TOKEN_PEPPER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          copy() {
            local name="$1"
            local value="${!name-}"
            if [ -z "$value" ]; then
              echo "missing $TARGET_ENV $name"
              return 0
            fi
            printf '%s' "$value" | gh secret set "$name" --repo pymthouse/pymthouse-deployments --env "$TARGET_ENV"
            echo "set $TARGET_ENV $name"
          }
          copy AUTH_TOKEN_PEPPER
          copy DATABASE_URL
          copy NEXTAUTH_SECRET
          copy VERCEL_TOKEN
