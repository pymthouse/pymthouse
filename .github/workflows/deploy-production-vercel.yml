name: Deploy production (Vercel)

# Thin caller. The build runs in pymthouse/pymthouse-deployments against this ref.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or SHA to deploy
        required: false
        type: string

concurrency:
  group: deploy-production-vercel
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: pymthouse/pymthouse-deployments/.github/workflows/deploy-production-vercel.yml@main
    with:
      ref: ${{ inputs.ref || github.ref_name }}
    secrets: inherit
