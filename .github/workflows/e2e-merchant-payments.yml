name: E2E merchant payments (staging)

# Full-flow validation of the merchant Stripe Connect rail against the deployed
# staging stack: webhook Plane B (account.updated / payment_method.attached),
# Kafka → OpenMeter collector → Konnect metering, the Usage APIs and balance
# gate, manual collection, and settlement collecting on the connected account.
#
# Nothing is stubbed. Settlement, Kafka and Konnect are shared with production,
# so isolation is by DATA, not by deployment:
#   - a dedicated fixture app (`E2E_CLIENT_ID`) in merchant billing mode,
#   - a dedicated Stripe **sandbox** account + connected account,
#   - a fresh, namespaced end-user per run (`e2e-merchant-<run id>-<ts>`).
# `scripts/e2e/merchant-payments.ts preflight` refuses to start against a
# production base URL or a live Stripe key.
#
# Enable with repository variable:
#   E2E_MERCHANT_PAYMENTS=true      (nightly schedule; dispatch always works)
#
# Secrets (environment `e2e / staging`):
#   E2E_M2M_CLIENT_SECRET             Builder M2M client secret (Basic auth)
#   E2E_STRIPE_SECRET_KEY             Stripe **sandbox** key (sk_test_…)
#   E2E_STRIPE_CONNECT_WEBHOOK_SECRET whsec_… for the Connect endpoint on staging
#
# Variables (environment `e2e / staging`):
#   E2E_BASE_URL                      https://staging.pymthouse.com
#   E2E_CLIENT_ID                     fixture app public client id (app_…)
#   E2E_M2M_CLIENT_ID                 fixture app m2m_… client id
#   E2E_STRIPE_CONNECTED_ACCOUNT_ID   acct_… onboarded in the sandbox
#   E2E_PLAN_ID                       optional; otherwise the first active usage plan
#   E2E_KAFKA_BROKERS                 optional host:port of the staging Redpanda proxy
#   E2E_KAFKA_TOPIC                   optional; defaults to livepeer-gateway-events
#
# Staging deployment prerequisites (see docs/e2e-merchant-payments.md):
#   PYMTHOUSE_ENABLE_WALLET_TEST_USAGE=1   only needed for `api` ingest mode
#   STRIPE_CONNECT_WEBHOOK_SECRET          Connect endpoint pointed at /webhooks/stripe
#   OPENMETER_CUSTOM_INVOICING_APP_ID / OPENMETER_MERCHANT_BILLING_PROFILE_ID

on:
  workflow_dispatch:
    inputs:
      ingest_mode:
        description: "How the charge event is produced"
        type: choice
        default: auto
        options: [auto, kafka, api]
      amount_usd:
        description: "Charge amount (must clear included usage + the $0.50 Stripe floor)"
        type: string
        default: "12.00"
      keep_fixtures:
        description: "Leave the fixture end-user active for debugging"
        type: boolean
        default: false
  schedule:
    # 07:20 UTC — after the nightly staging deploy has settled.
    - cron: "20 7 * * *"
  workflow_call:
    inputs:
      ingest_mode:
        type: string
        default: auto
    secrets:
      E2E_M2M_CLIENT_SECRET:
        required: true
      E2E_STRIPE_SECRET_KEY:
        required: true
      E2E_STRIPE_CONNECT_WEBHOOK_SECRET:
        required: true

# Serialise runs. The invoice trigger has a per-subject cooldown and settlement
# is shared infrastructure — two concurrent runs would race each other into
# `rate_limited` and make failures unreadable.
concurrency:
  group: e2e-merchant-payments
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merchant-flow:
    name: Merchant Connect payment flow
    # Scheduled runs are opt-in; dispatch and workflow_call always run.
    if: github.event_name != 'schedule' || vars.E2E_MERCHANT_PAYMENTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: e2e / staging
      url: ${{ vars.E2E_BASE_URL }}

    env:
      E2E_STATE_FILE: ${{ runner.temp }}/merchant-payments-state.json
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_CLIENT_ID: ${{ vars.E2E_CLIENT_ID }}
      E2E_M2M_CLIENT_ID: ${{ vars.E2E_M2M_CLIENT_ID }}
      E2E_M2M_CLIENT_SECRET: ${{ secrets.E2E_M2M_CLIENT_SECRET }}
      E2E_STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      E2E_STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_CONNECT_WEBHOOK_SECRET }}
      E2E_STRIPE_CONNECTED_ACCOUNT_ID: ${{ vars.E2E_STRIPE_CONNECTED_ACCOUNT_ID }}
      E2E_PLAN_ID: ${{ vars.E2E_PLAN_ID }}
      E2E_KAFKA_BROKERS: ${{ vars.E2E_KAFKA_BROKERS }}
      E2E_KAFKA_TOPIC: ${{ vars.E2E_KAFKA_TOPIC }}
      E2E_INGEST_MODE: ${{ inputs.ingest_mode || 'auto' }}
      E2E_AMOUNT_USD: ${{ inputs.amount_usd || '12.00' }}
      E2E_KEEP_FIXTURES: ${{ inputs.keep_fixtures || false }}

    steps:
      - name: Checkout pymthouse
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # --ignore-scripts and no db:prepare: the driver only speaks HTTP to the
      # deployed stack, so CI never needs a database or a Next build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install kcat (Kafka ingest mode)
        if: env.E2E_KAFKA_BROKERS != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends kafkacat

      # ---- 0. Guards -----------------------------------------------------
      # Refuses a production base URL, a live Stripe key, a missing Connect
      # webhook secret, or a connected account that is not charges_enabled.
      - name: Preflight — safety guards and Connect readiness
        run: node --import tsx scripts/e2e/merchant-payments.ts preflight

      # ---- 1. M2M user: default payment method + pay-per-use subscription --
      # Attaches a sandbox card straight to the connected-account customer, so
      # the REAL payment_method.attached Connect webhook drives the billing
      # profile restore — the hosted Checkout page cannot run headless.
      - name: Provision — end-user, subscription, default payment method
        run: node --import tsx scripts/e2e/merchant-payments.ts provision

      # ---- Webhook plane B: signature + handler ---------------------------
      # Replays the account's current flags (a no-op write) and then a forged
      # signature, so both the accept and reject paths are covered.
      - name: Webhook — signed account.updated on /webhooks/stripe
        run: node --import tsx scripts/e2e/merchant-payments.ts webhook-connect

      # ---- 2. Expensive charge event -> Kafka -> collector -> Konnect -----
      - name: Ingest — expensive create_signed_ticket event
        run: node --import tsx scripts/e2e/merchant-payments.ts ingest

      # ---- 3. Usage APIs + balance gate ----------------------------------
      - name: Verify — Usage API surfaces and balance gate
        run: node --import tsx scripts/e2e/merchant-payments.ts verify-usage

      # ---- 4. Manual collection: must be `invoiced`, never `skipped` ------
      - name: Collect — force a mid-cycle invoice
        run: node --import tsx scripts/e2e/merchant-payments.ts collect

      # ---- 5. Charge, invoices API, transactions ledger -------------------
      - name: Settle — Connect charge, invoices API, transactions ledger
        run: node --import tsx scripts/e2e/merchant-payments.ts settle

      - name: Teardown — suspend the fixture end-user
        if: always()
        continue-on-error: true
        run: node --import tsx scripts/e2e/merchant-payments.ts teardown

      # State carries the end-user id, invoice ids and the Stripe charge id —
      # the three things you need to trace a failure through Konnect,
      # settlement and the Stripe sandbox dashboard.
      - name: Upload run state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: merchant-payments-state
          path: ${{ runner.temp }}/merchant-payments-state.json
          retention-days: 14
          if-no-files-found: warn
