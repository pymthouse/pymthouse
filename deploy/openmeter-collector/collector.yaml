# OpenMeter Collector: go-livepeer remote signer Kafka -> hosted OpenMeter/Konnect.
#
# ETH/USD: fetched from PRICE_ORACLE_URL at startup (defaults to Coinbase spot endpoint;
# sequence blocks until
# warm succeeds; collector never reads Kafka until cache is populated). Refreshed on
# PRICE_ORACLE_REFRESH; refresh errors keep the last cached value. Runtime events read
# from cache only (no static default). Each egress CloudEvent includes data.eth_usd_price
# (the cached rate used for that event’s Wei → USD micros conversion), numeric data.fee_wei
# and data.billable_secs (so OpenMeter SUM valueProperty accumulates), and data.manifest_id
# (fallback: session_id → request_id → "unknown"). network_fee_usd_micros is the exact
# fractional fee_wei * eth_usd / 1e12 (no per-ticket ceil; read paths ceil once per
# session/boundary). Meter values that must SUM are numbers (not strings).
#
# Oracle JSON (any one shape):
#   {"price": 3456.78}
#   {"ethereum":{"usd":3456.78}}              # CoinGecko simple price API
#   {"data":{"amount":"3456.78"}}             # Coinbase spot API
#
# Identity (go-livepeer Kafka wire -> normalized CloudEvent egress):
# - Upstream auth_id stays client_id:usage_subject (webhook -> go-livepeer state -> Kafka).
# - Wire usage_subject may be:
#     owner:{users.id}              — owner self-usage (legacy / no actor split)
#     owner:{users.id}#actorExtId   — owner_rollup end-user (payer#actor)
#     eu_{end_users.id}#actorExtId  — merchant end-user (payer#actor)
#     actorExtId / app:actorExtId   — legacy compound / bare end-user
# - CloudEvent subject / openmeter_customer_key = payer (bare owner id or eu_…).
# - data.external_user_id = actor (integrator external id) for meter groupBy.
# - data.billing_subject_key / billing_subject_kind / actor_end_user_id added in schema v2.
# - data.client_id retains the app id for tenant attribution.
# - No "#" in the wire → same CE subject / external_user_id mapping as pre-v2
#   (owner: strip; end-user compound auth_id subject). Safe to deploy before JWT
#   producers start emitting payer#actor.
#
# Kong / OpenMeter meter dimensions:
# - Billing + analytics meters groupBy client_id, external_user_id, pipeline, and app
#   (model attribution). Extra data.* fields are CloudEvent-only; Konnect meters ignore
#   unknown paths.
# - Dual-write: data.model_id copies data.app so tenants whose meters still groupBy
#   model_id keep attributing without a meter recreate.
#
# Pipeline / app (wire -> CloudEvent dims):
# - Remote signer sends model attribution on Kafka `app` (e.g. livepeer-example/hello-world).
# - live-video-to-video still writes a pipeline but an empty app — use the pipeline
#   name as data.app (and data.model_id) in that case only.
# - Legacy: Kafka pipeline "base:model" (e.g. live-video-to-video:comfyui) is still
#   accepted on read paths via historical model_id grouping.
# - Also passthrough (CloudEvent data only, not meter dimensions): session_status,
#   orch_address, num_tickets.


cache_resources:
  - label: eth_usd
    memory: {}

processor_resources:
  - label: fetch_eth_usd_price
    try:
      - http:
          url: ${PRICE_ORACLE_URL:https://api.coinbase.com/v2/prices/ETH-USD/spot}
          verb: GET
      - mapping: |
          let price = match {
            this.exists("price") => this.price.number(),
            this.exists("ethereum.usd") => this.ethereum.usd.number(),
            this.exists("data.amount") => this.data.amount.number(),
            _ => null
          }
          root = if $price == null { throw("price oracle response missing price field") }
          root = $price.string()
      - cache:
          resource: eth_usd
          operator: set
          key: eth_usd
          value: ${! content() }

input:
  sequence:
    inputs:
      # Startup warm — must succeed before Kafka starts (no catch).
      - label: price_warm
        generate:
          count: 1
          interval: 0s
          mapping: 'root = {}'
        processors:
          - resource: fetch_eth_usd_price
          - mapping: root = deleted()

      # Ongoing: background refresh + Kafka events.
      - label: runtime
        broker:
          inputs:
            - label: price_refresh
              generate:
                count: 0
                interval: ${PRICE_ORACLE_REFRESH:5m}
                mapping: 'root = {}'
              processors:
                - try:
                    - resource: fetch_eth_usd_price
                    - mapping: root = deleted()
                - catch:
                    - log:
                        level: WARN
                        message: "price oracle refresh failed: ${! error() }"
                    - mapping: root = deleted()

            - label: kafka_events
              kafka:
                addresses:
                  - ${KAFKA_BROKERS}
                topics:
                  - ${KAFKA_GATEWAY_TOPIC}
                consumer_group: openmeter-collector
                start_from_oldest: true

pipeline:
  processors:
    - mapping: |
        root = if this.type != "create_signed_ticket" { deleted() }

    - branch:
        request_map: 'root = ""'
        processors:
          - cache:
              resource: eth_usd
              operator: get
              key: eth_usd
        result_map: |
          meta eth_usd_price = content().number()

    - mapping: |
        let data = this.data.or({})
        let auth_id_raw = $data.auth_id.or("").string().trim()
        let client_id_field = $data.client_id.or("").string().trim()
        let usage_subject = $data.usage_subject.or("").string().trim()
        let auth_id = if $auth_id_raw != "" {
          $auth_id_raw
        } else if $client_id_field != "" && $usage_subject != "" {
          $client_id_field + ":" + $usage_subject
        } else {
          ""
        }

        let colon = $auth_id.index_of(":")
        let is_compound = $colon > 0 && $colon < $auth_id.length() - 1
        let client_id = if $is_compound { $auth_id.slice(0, $colon) } else { $auth_id }
        let usage_subject_parsed = if $is_compound { $auth_id.slice($colon + 1) } else { $auth_id }

        # Payer#actor split (schema v2). No "#" means legacy single-subject form.
        let hash = $usage_subject_parsed.index_of("#")
        let has_actor_split = $hash > 0 && $hash < $usage_subject_parsed.length() - 1
        let payer_wire = if $has_actor_split {
          $usage_subject_parsed.slice(0, $hash)
        } else {
          $usage_subject_parsed
        }
        let actor_external_user_id = if $has_actor_split {
          $usage_subject_parsed.slice($hash + 1)
        } else {
          ""
        }

        let is_owner_subject = $payer_wire.index_of("owner:") == 0
        let is_end_user_customer = $payer_wire.index_of("eu_") == 0
        let usage_subject_type = if $is_owner_subject {
          "app_owner"
        } else {
          "external_user_id"
        }
        let billing_subject_kind = if $is_owner_subject {
          "owner_wallet"
        } else if $is_end_user_customer {
          "app_user_wallet"
        } else {
          "legacy_compound"
        }
        let owner_bare_id = if $is_owner_subject {
          $payer_wire.slice("owner:".length())
        } else {
          $payer_wire
        }
        # CE subject = payer customer key (bare owner id, eu_…, or legacy compound auth_id).
        let openmeter_subject = if $is_owner_subject {
          $owner_bare_id
        } else if $is_end_user_customer {
          $payer_wire
        } else if $has_actor_split {
          $payer_wire
        } else {
          $auth_id
        }
        let openmeter_customer_key = $openmeter_subject
        let usage_subject_out = if $is_owner_subject { $owner_bare_id } else { $payer_wire }
        # Actor for meter groupBy — never overwrite with the payer.
        let external_user_id_out = if $actor_external_user_id != "" {
          $actor_external_user_id
        } else if $is_owner_subject {
          $owner_bare_id
        } else if $is_end_user_customer {
          $payer_wire
        } else {
          $usage_subject_parsed
        }
        let actor_end_user_id_out = if $is_end_user_customer {
          $payer_wire
        } else {
          ""
        }

        let eth_usd = meta("eth_usd_price").number()
        root = if $eth_usd == null { throw("eth_usd price cache miss") }

        # USD micros = fee_wei * eth_usd / 1e12 (1 USD = 1e6 micros).
        # Exact fractional value at ingest (no per-ticket ceil). Read paths and
        # session/display boundaries ceil once so sub-micro tickets accumulate
        # into whole micros without overbilling dense sessions.
        let fee_wei = $data.computed_fee.number().or(0)
        let fee_usd_micros = $fee_wei * $eth_usd / 1000000000000
        let billable_secs = $data.billable_secs.number().or(0)
        # Session key: stream mid → payment StateID → request id (BYOC/stateless).
        let manifest_id = if $data.manifest_id != "" && $data.manifest_id != null {
          $data.manifest_id.string().trim()
        } else if $data.session_id != "" && $data.session_id != null {
          $data.session_id.string().trim()
        } else if $data.request_id != "" && $data.request_id != null {
          $data.request_id.string().trim()
        } else {
          "unknown"
        }
        let manifest_id_out = if $manifest_id != "" { $manifest_id } else { "unknown" }

        # Pipeline / app: signer model attribution is `app`. Do not split pipeline
        # on ':'. Dual-write the same value onto model_id for legacy meters.
        # live-video-to-video uses pipeline as app when Kafka app is empty.
        let pipeline_raw = if $data.pipeline != "" && $data.pipeline != null {
          $data.pipeline.string().trim()
        } else {
          ""
        }
        let pipeline_out = if $pipeline_raw == "" { "unknown" } else { $pipeline_raw }

        let app_raw = $data.app.or("").string().trim()
        let app_out = if $app_raw != "" && $app_raw.lowercase() != "unknown" {
          $app_raw
        } else if $pipeline_out == "live-video-to-video" {
          $pipeline_out
        } else {
          "unknown"
        }

        let session_status_out = $data.session_status.or("").string()
        let orch_address_out = $data.orch_address.or("").string()
        let num_tickets_out = $data.num_tickets.number().or(0)

        root = if $auth_id == "" {
          deleted()
        } else {
          {
            "specversion": "1.0",
            "type": "create_signed_ticket",
            "id": $data.request_id.or(uuid_v4()),
            "source": "go-livepeer-remote-signer",
            "subject": $openmeter_subject,
            "time": $data.current_time.or(now()),
            "data": {
              "schema_version": "2",
              "client_id": $client_id,
              "usage_subject": $usage_subject_out,
              "usage_subject_type": $usage_subject_type,
              "external_user_id": $external_user_id_out,
              "billing_subject_key": $openmeter_customer_key,
              "billing_subject_kind": $billing_subject_kind,
              "actor_end_user_id": $actor_end_user_id_out,
              "network_fee_usd_micros": $fee_usd_micros,
              "pipeline": $pipeline_out,
              "app": $app_out,
              "model_id": $app_out,
              "manifest_id": $manifest_id_out,
              "session_status": $session_status_out,
              "orch_address": $orch_address_out,
              "num_tickets": $num_tickets_out,
              # Numbers (not strings) so OpenMeter SUM $.billable_secs / $.fee_wei accumulate.
              "billable_secs": $billable_secs,
              "pixels": $data.pixels.string().or("0"),
              "fee_wei": $fee_wei,
              "auth_id": $auth_id,
              "openmeter_customer_key": $openmeter_customer_key,
              "eth_usd_price": $eth_usd.string(),
              "gateway_request_id": $data.request_id,
            }
          }
        }

    - catch:
        - log:
            level: ERROR
            message: "signed_ticket mapping failed: ${! error() }"
        - mapping: root = deleted()

# Konnect ingest is POST {OPENMETER_URL}/events (not /api/v1/events). For self-hosted
# OpenMeter, set OPENMETER_INGEST_URL to ${OPENMETER_URL}/api/v1/events in compose.

output:
  http_client:
    url: ${OPENMETER_INGEST_URL}
    verb: POST
    headers:
      Authorization: "Bearer ${OPENMETER_API_KEY}"
      Content-Type: application/cloudevents+json
    successful_on:
      - 200
      - 202
      - 204
